<!DOCTYPE HTML>
<html lang="ko">
	<head>
		<title>Zerossin</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Zerossin — Personal Operating System" />
		<script>
			// 잠금화면을 이미 본 적 있으면(localStorage), 홈 화면이 잠깐이라도
			// 보였다가 잠금화면에 덮이는 깜빡임이 없도록 CSS 적용 전에 미리
			// html에 표시해둔다. head에서 동기적으로 실행되므로 첫 페인트 전에 끝남.
			try {
				if (localStorage.getItem("zerossin-lock-seen")) {
					document.documentElement.classList.add("no-lock");
				}
			} catch (e) {}
		</script>
		<link rel="stylesheet" href="assets/css/os.css" />

		<link rel="shortcut icon" href="favicon.ico">
		<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
	</head>
	<body>

		<div class="sky" aria-hidden="true">
			<div class="sky-glow"></div>
			<div class="sky-moon"></div>
			<div class="sky-stars"></div>

			<span class="firefly" style="--x:8%; --y:78%; --dur:9s; --delay:-1s;"></span>
			<span class="firefly" style="--x:14%; --y:52%; --dur:7s; --delay:-4s;"></span>
			<span class="firefly firefly--pink" style="--x:22%; --y:88%; --dur:10s; --delay:-6s;"></span>
			<span class="firefly" style="--x:30%; --y:35%; --dur:8s; --delay:-2s;"></span>
			<span class="firefly" style="--x:38%; --y:70%; --dur:11s; --delay:-8s;"></span>
			<span class="firefly firefly--cyan" style="--x:46%; --y:20%; --dur:9s; --delay:-3s;"></span>
			<span class="firefly" style="--x:52%; --y:82%; --dur:7.5s; --delay:-5s;"></span>
			<span class="firefly" style="--x:60%; --y:45%; --dur:10.5s; --delay:-1.5s;"></span>
			<span class="firefly firefly--pink" style="--x:67%; --y:65%; --dur:8.5s; --delay:-7s;"></span>
			<span class="firefly" style="--x:74%; --y:30%; --dur:9.5s; --delay:-4.5s;"></span>
			<span class="firefly" style="--x:80%; --y:85%; --dur:11.5s; --delay:-2.5s;"></span>
			<span class="firefly firefly--cyan" style="--x:88%; --y:58%; --dur:7s; --delay:-6.5s;"></span>
			<span class="firefly" style="--x:93%; --y:72%; --dur:9s; --delay:-9s;"></span>
			<span class="firefly" style="--x:5%; --y:20%; --dur:10s; --delay:-3.5s;"></span>
			<span class="firefly" style="--x:96%; --y:25%; --dur:8s; --delay:-0.5s;"></span>

			<div class="sky-hills"></div>
		</div>

		<div id="os">
			<header class="os-statusbar">
				<span class="os-name">Zerossin</span>
				<div class="os-statusbar-right">
					<button class="cc-trigger" id="cc-trigger" aria-label="제어센터 열기" type="button">
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
							<mask id="cc-trigger-mask">
								<rect x="0" y="0" width="24" height="24" fill="#fff" />
								<circle cx="17" cy="17.5" r="3" fill="#000" />
							</mask>
							<rect x="2" y="3" width="20" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6" />
							<circle cx="8" cy="6.5" r="2.6" fill="currentColor" />
							<rect x="2" y="14" width="20" height="7" rx="3.5" fill="currentColor" mask="url(#cc-trigger-mask)" />
						</svg>
					</button>
					<span class="os-clock" id="os-clock"></span>
				</div>
			</header>

			<main class="home-grid" id="home">
				<noscript>
					<p style="grid-column: 1 / -1; text-align: center;">
						이 페이지는 JavaScript가 필요합니다.
						<a href="https://github.com/zerossin">GitHub</a>에서 프로젝트를 볼 수 있습니다.
					</p>
				</noscript>
			</main>

			<footer class="os-footer">
				<p>&copy; Zerossin &middot; <a href="https://github.com/zerossin" target="_blank" rel="noreferrer">GitHub</a></p>
			</footer>
		</div>

		<div id="lockscreen" class="lockscreen">
			<div class="lock-time" id="lock-time"></div>
			<div class="lock-date" id="lock-date"></div>
			<div class="lock-hint"><span class="lock-hint-chevron"></span>탭하여 잠금 해제</div>
		</div>

		<div class="cc-backdrop" id="cc-backdrop"></div>
		<div class="cc-panel" id="cc-panel">
			<button class="cc-circle" id="cc-toggle-motion" type="button" role="switch" aria-checked="false" aria-label="애니메이션 토글">
				<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
					<circle cx="17" cy="12" r="3" fill="currentColor" />
					<path class="cc-icon-motion-trail" d="M3 12h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
					<path class="cc-icon-motion-trail" d="M6 7.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
					<path class="cc-icon-motion-trail" d="M6 16.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
				</svg>
			</button>
			<button class="cc-circle" id="cc-action-lock" type="button" aria-label="잠금화면 다시 보기">
				<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
					<circle cx="12" cy="13" r="7" fill="none" stroke="currentColor" stroke-width="1.8" />
					<line x1="12" y1="3" x2="12" y2="11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
				</svg>
			</button>
		</div>

		<script src="assets/js/os.js"></script>

	</body>
</html>
